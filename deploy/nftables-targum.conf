# /etc/nftables-targum.conf — included from /etc/nftables.conf.
#
# One rule, and it exists because of one sentence in the token minter's own source:
#
#     host: "::"
#     // ipv4 only systems might not be able to bind to "::", so we try 0.0.0.0 instead
#     // this is temporary as we plan to bind to localhost in the next major version
#
# bgutil 1.3.2 — the latest release, not an old pin — listens on every interface and has
# no --host to say otherwise; that flag exists only on master. Its README says the
# binding is loopback. It is not: `ss -lntp` on 2026-09-04 said `*:4416`. A token minter
# reachable from the internet is somebody else's free YouTube-unblocking service running
# on targum's IP and spending targum's reputation with Google, which is the whole thing
# the cookie file was refused to avoid.
#
# The provider's egress is untouched: minting means talking to YouTube. Only the way in
# is closed, and only from anywhere that is not this machine.
#
# `policy accept` on purpose. This box had no firewall at all before this file, so a
# chain that dropped by default would be a lock-out with an SSH session as its only
# warning. This adds one rule and changes nothing else; ufw or a real policy is a
# separate decision with a console at hand.

table inet targum {
	chain input {
		type filter hook input priority filter; policy accept;
		iif != "lo" tcp dport 4416 drop
	}
}
