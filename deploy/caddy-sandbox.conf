# /etc/systemd/system/caddy.service.d/10-targum-sandbox.conf — written by deploy/harden.sh
# (targum-internal#9), and by nothing else.
#
# Caddy is the one process on the box that strangers talk to, and the package's own unit
# gives it the least room-limiting of anything here: `systemd-analyze security` said 8.8
# EXPOSED on 2026-10-28, against 5.3 for targum.service and the minter, which already
# carry these lines. This is the same set, fitted to what Caddy does on this box and
# nothing more: it proxies to 127.0.0.1:8420, keeps its certificates and autosaved config
# under its home, /var/lib/caddy, and writes the access logs the visitor count reads to
# /var/log/caddy (deploy/Caddyfile). It serves no files from disk.
#
# The package's ExecStart, ExecReload, User and AmbientCapabilities stay as they are; a
# drop-in only adds. CAP_NET_BIND_SERVICE is what lets it listen on 80 and 443 as the
# caddy user, and CAP_NET_ADMIN is what lets QUIC raise its socket buffers, so the bound
# set keeps exactly those two.
#
# If Caddy will not start with it, harden.sh takes it out again by itself. By hand:
#
#   rm /etc/systemd/system/caddy.service.d/10-targum-sandbox.conf
#   systemctl daemon-reload && systemctl restart caddy

[Service]
ProtectSystem=strict
ReadWritePaths=/var/lib/caddy /var/log/caddy
ProtectHome=true
NoNewPrivileges=true
PrivateDevices=true
ProtectKernelTunables=true
ProtectKernelModules=true
ProtectKernelLogs=true
ProtectControlGroups=true
ProtectClock=true
ProtectHostname=true
RestrictSUIDSGID=true
RestrictRealtime=true
RestrictNamespaces=true
LockPersonality=true
SystemCallArchitectures=native
# AF_NETLINK: Go reads the machine's interfaces and addresses through it.
RestrictAddressFamilies=AF_INET AF_INET6 AF_UNIX AF_NETLINK
CapabilityBoundingSet=CAP_NET_BIND_SERVICE CAP_NET_ADMIN
