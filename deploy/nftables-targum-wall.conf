# /etc/nftables-targum-wall.conf — the box's firewall, included from /etc/nftables.conf
# by deploy/harden.sh and by nothing else (targum-internal#9).
#
# What may come in: SSH, the web, and the few things the network itself needs. Everything
# else is dropped, which includes the token minter's 4416 that nftables-targum.conf
# already closes — that table stays, so the minter is shut whether or not this one is on.
#
# One table, one file, one transaction. The SSH rule and the drop policy arrive together
# or not at all, so there is no instant at which the policy is in and the rule is not.
# That is the lock-out ufw's `allow` then `enable` leaves as two commands, and it is not
# the reason ufw was passed over: /etc/nftables.conf opens with `flush ruleset`, and
# nftables.service and ufw.service are both `Before=network-pre.target` with no order
# between them, so on a boot where nftables ran second it would erase every ufw rule and
# leave the box open while `ufw status` still said active. This box already speaks nft.
#
# Priority `filter - 1` so it is read before the other input chains; a packet has to be
# accepted by every base chain on the hook to arrive, so the order only decides which
# drop it meets first.

table inet targum_wall {
	chain input {
		type filter hook input priority filter - 1; policy drop;

		iif "lo" accept
		# The way back in comes first, and before the conntrack rules, so that no later
		# edit to this file can put anything between a new SSH connection and its accept.
		tcp dport 22 accept

		ct state established,related accept
		ct state invalid drop

		# Caddy: HTTP for the ACME challenge and the redirect, HTTPS, and HTTP/3 on UDP.
		tcp dport { 80, 443 } accept
		udp dport 443 accept

		# What the network needs. ICMPv6 carries IPv6 neighbour discovery — without it the
		# box's v6 address stops answering within minutes — and path-MTU on both families.
		meta l4proto { icmp, ipv6-icmp } accept
		# Hetzner hands out the v4 address by DHCP; a renewal the wall refused would take
		# the address away, which is an outage the firewall would have caused.
		udp dport { 68, 546 } accept
	}
}
