name: checks
on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --extra difficulty
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      # Provider calls run against recorded fakes; tests needing a downloaded
      # language model, the network, or the aligner benchmark skip themselves.
      - run: uv run pytest -q
