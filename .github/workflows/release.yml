name: release

# Publishes to PyPI when a version tag is pushed, e.g. v0.1.0.
# Authentication is PyPI trusted publishing (OIDC): no API token is stored
# anywhere. The environment name below must match the pending publisher
# configured at pypi.org/manage/account/publishing.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      # The same extras CI installs. A release that runs a narrower suite than the
      # checks on the commit it was cut from is a release nothing has actually checked.
      - run: uv sync --extra difficulty --extra phonetics --extra covers
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest -q
      - run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
