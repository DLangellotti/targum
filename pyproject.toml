[project]
name = "targum"
version = "0.2.0.0"
description = "Turn a text and its translations into a self-contained HTML bilingual reader"
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "David Langellotti" }]
keywords = ["translation", "language-learning", "bilingual", "reader", "hebrew", "russian"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
  "Programming Language :: Python :: 3.11",
  "Topic :: Education",
  "Topic :: Text Processing :: Linguistic",
]
dependencies = [
  "typer>=0.12",
  "rich>=13.7",
  "pydantic>=2.7",
  "jinja2>=3.1",
  "stanza>=1.8",
  "anthropic>=0.40",
  "beautifulsoup4>=4.12",
  "trafilatura>=1.12",
  "httpx>=0.27",
  "nakdimon>=0.1",
]

[project.optional-dependencies]
align = ["sentence-transformers>=3.0"]
# Forced alignment of a supplied transcript against its recording. Torch rides in with
# it; on the box Stanza already brought torch, so the marginal weight is the model.
#
# Permissive, which it was not. Until 2026-09-02 this installed `ctc-forced-aligner`
# (CC BY-NC 4.0) on an MMS-lineage model that was NonCommercial as well, and it was one
# of the two reasons an install of targum could carry a NonCommercial term at all. The
# algorithm was never the encumbered part — CTC forced alignment is `torchaudio`, BSD-2 —
# so only the acoustic model changed: `imvladikon/wav2vec2-large-xlsr-53-hebrew`,
# Apache-2.0, from XLS-R (Apache-2.0) on Common Voice (CC0). Fetched at first use like
# every other model rather than pinned here, because it is weights and not code.
speech-align = [
  "torchaudio>=2.1",
  "transformers>=4.40",
]
covers = ["pillow>=10.0"]
difficulty = ["wordfreq>=3.1"]
# Not a hard dependency, and not because it is heavy — it is 24 kB of rule tables. It
# caps Python below 3.13, and the reader that would lose is the one on a Python targum
# otherwise supports. Without it a text is built with no readings and says so in the
# annotator's name, so installing it later re-reads every book already on the shelf.
phonetics = ["phonikud>=0.4"]
# The reader in a real browser. Out of the default install because it is a browser: the
# wheel on the box has no use for one, and `playwright install chromium` is a second
# step and a few hundred megabytes. Without it `tests/test_reader_browser.py` skips
# itself, the way the node tests skip without node.
browser = ["playwright>=1.44"]

[project.urls]
Homepage = "https://github.com/DLangellotti/targum"

[project.scripts]
targum = "targum.cli:main"

[dependency-groups]
# fontTools reads the embedded Hebrew faces in `tests/test_render.py`, which checks they
# can actually draw every mark a Masoretic text contains. That check is the one that would
# have caught a reading font with no accents in it before a reader did.
dev = ["pytest>=8.2", "mypy>=1.10", "ruff>=0.5", "fonttools[woff]>=4.50"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# For the speech-align extra's git address; hatchling refuses direct references
# without being told they are meant.
[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/targum"]
# Written by `about.stamp()` just before the build and ignored by git, so hatchling —
# which leaves VCS-ignored files out — has to be told to pack it. It is how the about
# page has anything to say on a box, where there is a wheel and no repository.
artifacts = ["/src/targum/activity.json"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
# The package supports 3.11 and up, but numpy, which arrives with the align extra,
# ships stubs written in 3.12 syntax that mypy cannot parse under an older target.
# So the type check runs against 3.12 and requires-python states the real floor.
python_version = "3.12"
strict = true
files = ["src/targum"]

[[tool.mypy.overrides]]
module = [
  "stanza.*",
  "trafilatura.*",
  "sentence_transformers.*",
  "wordfreq.*",
  "nakdimon.*",
  "phonikud.*",
  "torch.*",
  "torchaudio.*",
  "transformers.*",
]
ignore_missing_imports = true

# The half that makes content is gitignored (see .gitignore), so a public checkout —
# CI's — has no such modules: the weekly's writer, and the waveform tools that cut a
# recording into parts. Every import of them is already guarded with ImportError; this
# keeps the type check from failing where the files are absent. Listed by name rather
# than as `targum.weekly.*`, so a typo in the open half still fails.
[[tool.mypy.overrides]]
module = [
  "targum.weekly.facts",
  "targum.weekly.sources",
  "targum.weekly.prompts",
  "targum.weekly.write",
  "targum.weekly.voice",
  "targum.recording.attach",
]
ignore_missing_imports = true



[tool.pytest.ini_options]
testpaths = ["tests"]
